<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0c0b08">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Elwin">
  <link rel="apple-touch-icon" href="/static/icon.svg">

  <link rel="manifest" href="/static/manifest.json">
  <link rel="stylesheet" href="/static/style.css">
  <title>Elwin Ransom</title>
</head>
<body>

<!-- ── Auth ──────────────────────────────────────────────── -->
<div id="auth-screen">
  <div id="auth-box">
    <h1>Elwin Ransom</h1>
    <p>Enter your password to continue.</p>
    <form id="auth-form">
      <input type="password" id="password-input" placeholder="Password" autocomplete="current-password" autofocus>
      <p id="auth-error"></p>
      <button type="submit">Enter</button>
    </form>
  </div>
</div>

<!-- ── App ───────────────────────────────────────────────── -->
<div id="app">

  <!-- Sidebar overlay -->
  <div id="sidebar-overlay" aria-hidden="true"></div>

  <!-- Sidebar -->
  <nav id="sidebar-nav" aria-label="Menu">
    <div id="sidebar-header">
      <span>Elwin Ransom</span>
      <button id="close-sidebar-btn" aria-label="Close menu">&times;</button>
    </div>

    <button class="sidebar-btn" id="btn-new">New Conversation</button>
    <button class="sidebar-btn" id="btn-conversations">Conversations</button>
    <div class="sidebar-sep"></div>
    <button class="sidebar-btn" id="btn-schedule">Schedule</button>
    <button class="sidebar-btn" id="btn-todos">Todos</button>
    <button class="sidebar-btn" id="btn-notes">Notes</button>
    <div class="sidebar-sep"></div>
    <button class="sidebar-btn" id="btn-briefing">Morning Briefing</button>
    <button class="sidebar-btn" id="btn-presence">Status</button>
    <button class="sidebar-btn" id="btn-memory">Memory Inspector</button>
    <button class="sidebar-btn" id="btn-usage">Search Usage</button>
    <div class="sidebar-sep"></div>
    <button class="sidebar-btn" id="btn-push">Enable Notifications</button>
  </nav>

  <!-- Header -->
  <header>
    <button class="header-btn" id="menu-btn" aria-label="Open menu">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
        <line x1="2" y1="5" x2="16" y2="5"/>
        <line x1="2" y1="9" x2="16" y2="9"/>
        <line x1="2" y1="13" x2="16" y2="13"/>
      </svg>
    </button>
    <h1>Elwin</h1>
    <div id="header-right">
      <span id="status-text"></span>
      <div id="status-dot" title="Status"></div>
      <button class="header-btn" id="tts-btn" aria-label="Toggle voice output" title="Toggle voice">
        <svg id="tts-icon-on" width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="3,6 7,6 12,2 12,16 7,12 3,12"/>
          <path d="M14.5 6.5a4 4 0 0 1 0 5"/>
        </svg>
        <svg id="tts-icon-off" width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" style="display:none">
          <polygon points="3,6 7,6 12,2 12,16 7,12 3,12"/>
          <line x1="15" y1="6.5" x2="17" y2="11.5"/>
          <line x1="17" y1="6.5" x2="15" y2="11.5"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- Messages -->
  <main id="messages" aria-live="polite" aria-label="Conversation"></main>

  <!-- Info panel -->
  <div id="info-panel" role="region" aria-label="Info">
    <div id="info-header">
      <span id="info-title"></span>
      <button id="info-close" aria-label="Close">&times;</button>
    </div>
    <div id="info-content"></div>
  </div>

  <!-- Input area -->
  <div id="input-area">
    <button class="icon-btn" id="attach-btn" aria-label="Attach image">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="4" width="14" height="10" rx="1"/>
        <circle cx="6.5" cy="8" r="1.5"/>
        <path d="M2 13l4-4 3 3 2.5-2.5L16 13"/>
      </svg>
    </button>
    <textarea id="message-input" rows="1" placeholder="Message Elwin..." aria-label="Message input"></textarea>
    <button class="icon-btn" id="mic-btn" aria-label="Record voice">
      <svg id="mic-icon" width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="6" y="1" width="6" height="9" rx="3"/>
        <path d="M3 9a6 6 0 0 0 12 0"/>
        <line x1="9" y1="15" x2="9" y2="17"/>
      </svg>
    </button>
    <button id="send-btn" aria-label="Send" disabled>
      <svg id="send-icon" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M2 8h12M9 3l5 5-5 5"/>
      </svg>
      <svg id="stop-icon" width="14" height="14" viewBox="0 0 14 14" fill="currentColor" style="display:none">
        <rect x="2" y="2" width="10" height="10" rx="1.5"/>
      </svg>
    </button>
  </div>

  <!-- File input: image + document types -->
  <input type="file" id="file-input" accept="image/*,.pdf,.txt,.csv,text/plain,text/csv,application/pdf" style="display:none" aria-hidden="true">

</div>

<script src="/static/app.js"></script>
</body>
</html>
